name: Canonical source archive download proof
on:
  push:
    branches: [ci-download-proof-official-assets-v1]
    paths: [.github/workflows/ci_download_proof.yml]
permissions:
  contents: read
jobs:
  download-only:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - key: cereal
            runner: ubuntu-24.04
          - key: curl
            runner: ubuntu-24.04-arm
          - key: blosc
            runner: windows-11-vs2026-arm
          - key: slvs
            runner: windows-11-vs2026-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Download original source archive and require full SHA256
        shell: python
        env:
          SOURCE_KEY: ${{ matrix.key }}
        run: |
          import hashlib, json, os, pathlib, re, signal, subprocess, sys, time
          ASSETS = json.loads('{"cereal":["https://codeload.github.com/USCiLab/cereal/zip/refs/tags/v1.3.0","71642cb54658e98c8f07a0f0d08bf9766f1c3771496936f6014169d3726d9657"],"curl":["https://codeload.github.com/curl/curl/zip/refs/tags/curl-7_75_0","a63ae025bb0a14f119e73250f2c923f4bf89aa93b8d4fafa4a9f5353a96a765a"],"blosc":["https://codeload.github.com/tamasmeszaros/c-blosc/zip/refs/heads/v1.17.0_tm","dcb48bf43a672fa3de6a4b1de2c4c238709dad5893d1e097b8374ad84b1fc3b3"],"slvs":["https://codeload.github.com/JacobStoren/SolveSpaceLib/zip/4d8704523e4bf212fadf5189f92484244f670fea","1c4bdde9c3c6ef20ea4b50b73601de56769f2eb131b36927d7c6489f102e6c30"]}')
          HELPER = 'cmake_minimum_required(VERSION 3.10)\nfile(DOWNLOAD "${ARCHIVE_URL}" "${ARCHIVE_FILE}"\n    EXPECTED_HASH "${ARCHIVE_SHA256}" TLS_VERIFY ON\n    TIMEOUT 300 INACTIVITY_TIMEOUT 60 STATUS status)\nlist(GET status 0 code)\nmessage(STATUS "proof_transport_status=${code}")\nif (NOT code EQUAL 0)\n    message(FATAL_ERROR "Pinned official source download was not verified")\nendif ()\n'
          EXPECTED_HELPER = '5c11d7f2e442dc4cd00d461d3d594fe4462bcb716a77fe1a25d3af552c5758ff'
          key = os.environ["SOURCE_KEY"]
          url, expected = ASSETS[key]
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / ("sourcearchive-proof-" + key)
          root.mkdir(exist_ok=False)
          report = {"source": key, "head": os.environ["GITHUB_SHA"], "runner_os": os.environ["RUNNER_OS"],
                    "probe_sha256": hashlib.sha256(HELPER.encode()).hexdigest(), "verified": False,
                    "scope": "Download only; no native fallback, extraction, installation or asset execution"}
          def save():
              (root / "result.json").write_text(json.dumps(report, indent=2) + "\n")
          def verified(rc, timed_out, cleanup_uncertain, digest):
              return rc == 0 and not timed_out and not cleanup_uncertain and digest == expected
          save()
          try:
              assert report["probe_sha256"] == EXPECTED_HELPER
              policy = ["CMAKE_TLS_CAINFO", "CMAKE_TLS_VERSION", "CMAKE_TLS_VERIFY", "CMAKE_NETRC", "CMAKE_NETRC_FILE"]
              report["transport_policy_env_present"] = {k: bool(os.environ.get(k)) for k in policy}
              assert not any(report["transport_policy_env_present"].values()), "custom transport policy: preserve native behavior"
              version = subprocess.run(["cmake", "--version"], capture_output=True, timeout=15, check=True).stdout.decode("utf-8", "replace").splitlines()[0]
              assert re.fullmatch(r"cmake version [0-9.]+(?:[-a-zA-Z0-9.]*)?", version)
              report["cmake_version"] = version
              helper = root / "DownloadPinnedSource.cmake"
              helper.write_bytes(HELPER.encode())
              archive = root / "archive.zip"
              options = {"start_new_session": True} if os.name != "nt" else {"creationflags": subprocess.CREATE_NEW_PROCESS_GROUP}
              started = time.monotonic()
              process = subprocess.Popen(["cmake", "-DARCHIVE_URL=" + url, "-DARCHIVE_SHA256=SHA256=" + expected,
                                          "-DARCHIVE_FILE=" + str(archive), "-P", str(helper)],
                                         stdout=subprocess.PIPE, stderr=subprocess.PIPE, **options)
              report["timeout"] = False
              report["cleanup_uncertain"] = False
              try:
                  stdout, stderr = process.communicate(timeout=360)
              except subprocess.TimeoutExpired:
                  report["timeout"] = True
                  try:
                      if os.name == "nt":
                          subprocess.run(["taskkill", "/PID", str(process.pid), "/T", "/F"], capture_output=True, timeout=15, check=True)
                      else:
                          os.killpg(process.pid, signal.SIGKILL)
                      stdout, stderr = process.communicate(timeout=15)
                  except Exception:
                      report["cleanup_uncertain"] = True
                      stdout, stderr = b"", b""
              report["seconds"] = round(time.monotonic() - started, 3)
              report["helper_rc"] = process.returncode
              # Retain only helper-authored numeric diagnostics. Never retain raw curl/redirect logs.
              for label, data in [("stdout", stdout), ("stderr", stderr)]:
                  safe = []
                  for line in data.decode("utf-8", "replace").splitlines():
                      if re.fullmatch(r"-- proof_transport_status=[0-9]+", line):
                          safe.append(line)
                      if re.fullmatch(r"-- Transient HTTP/[0-9.]+ (503|504); retrying source archive \([12]/3\)", line):
                          safe.append(line)
                      if re.fullmatch(r"  Source archive download failed \(status [0-9]+; (?:HTTP/[0-9.]+ [0-9]{3})?\)", line):
                          safe.append(line.strip())
                      if line.strip() == "Source archive SHA256 mismatch":
                          safe.append(line.strip())
                  (root / (label + ".sanitized.log")).write_text("\n".join(safe) + "\n")
              report["archive_present"] = archive.is_file() and not archive.is_symlink()
              report["bytes"] = archive.stat().st_size if report["archive_present"] else 0
              digest = None
              if report["archive_present"]:
                  with archive.open("rb") as stream:
                      digest = hashlib.file_digest(stream, "sha256").hexdigest() if hasattr(hashlib, "file_digest") else hashlib.sha256(stream.read()).hexdigest()
              report["sha256"] = digest
              report["verified"] = verified(process.returncode, report["timeout"], report["cleanup_uncertain"], digest)
              report["classification"] = "full_sha256_verified" if report["verified"] else ("no_verified_archive" if process.returncode == 0 and not report["archive_present"] else "download_not_verified")
          except Exception as error:
              report["error_type"] = type(error).__name__
          finally:
              save()
          print(json.dumps(report, sort_keys=True))
          sys.exit(0 if report["verified"] else 1)
      - name: Preserve sanitized verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sourcearchive-download-proof-${{ matrix.key }}
          path: |
            ${{ runner.temp }}/sourcearchive-proof-${{ matrix.key }}/result.json
            ${{ runner.temp }}/sourcearchive-proof-${{ matrix.key }}/*.sanitized.log
          if-no-files-found: error
          retention-days: 7
