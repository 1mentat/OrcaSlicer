name: Python tooling tests

on:
  pull_request:
    paths:
      - 'scripts/slicer_process.py'
      - 'scripts/_slicer_windows_job.py'
      - 'scripts/clang_tidy_diff.py'
      - 'scripts/tests/test_slicer_process.py'
      - 'scripts/tests/test_clang_tidy_diff.py'
      - 'scripts/slicer_module_feedback.py'
      - 'scripts/tests/test_slicer_module_feedback.py'
      - 'scripts/slicer_pr_validation.py'
      - 'scripts/tests/test_slicer_pr_validation.py'
      - 'scripts/settings_inventory.py'
      - 'scripts/tests/test_settings_inventory.py'
      - 'scripts/slicer_mutation.py'
      - 'scripts/tests/test_slicer_mutation.py'
      - 'scripts/validation_*.py'
      - 'scripts/tests/test_validation_*.py'
      - '.github/validation-producers.json'
      - '.github/actions/validation-upload/**'
      - '.github/workflows/python-tooling-tests.yml'
  push:
    paths:
      - 'scripts/slicer_process.py'
      - 'scripts/_slicer_windows_job.py'
      - 'scripts/clang_tidy_diff.py'
      - 'scripts/tests/test_slicer_process.py'
      - 'scripts/tests/test_clang_tidy_diff.py'
      - 'scripts/slicer_module_feedback.py'
      - 'scripts/tests/test_slicer_module_feedback.py'
      - 'scripts/slicer_pr_validation.py'
      - 'scripts/tests/test_slicer_pr_validation.py'
      - 'scripts/settings_inventory.py'
      - 'scripts/tests/test_settings_inventory.py'
      - 'scripts/slicer_mutation.py'
      - 'scripts/tests/test_slicer_mutation.py'
      - 'scripts/validation_*.py'
      - 'scripts/tests/test_validation_*.py'
      - '.github/validation-producers.json'
      - '.github/actions/validation-upload/**'
      - '.github/workflows/python-tooling-tests.yml'

permissions:
  contents: read

jobs:
  python-tooling:
    name: Python tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Ninja for build-reuse fixtures
        run: |
          python -m pip install --only-binary=:all: --no-deps ninja==1.13.0
      - name: Require Ninja for build-reuse fixtures
        run: python -c "import shutil; assert shutil.which('ninja'), 'Ninja is required for real build-reuse controls'"
      - name: Test scoped process handling
        run: python -B -m unittest discover -s scripts/tests -p test_slicer_process.py -v
      - name: Test clang-tidy diff handling
        run: python -B -m unittest discover -s scripts/tests -p test_clang_tidy_diff.py -v
      - name: Test module feedback handling
        run: python -B -m unittest discover -s scripts/tests -p test_slicer_module_feedback.py -v
      - name: Test validation runner contracts
        run: python -B -m unittest discover -s scripts/tests -p test_slicer_pr_validation.py -v
      - name: Require symlink support for mutation worktree controls
        run: |
          python -c "import tempfile; from pathlib import Path; scratch=tempfile.TemporaryDirectory(prefix='mutation-symlink-preflight-'); root=Path(scratch.name); target=root/'target'; target.mkdir(); link=root/'link'; link.symlink_to(target, target_is_directory=True); assert link.is_symlink(); link.unlink(); scratch.cleanup(); print('Owned directory symlink capability verified')"
      - name: Test mutation runner contracts
        run: python -B -m unittest discover -s scripts/tests -p test_slicer_mutation.py -v
      - name: Test settings inventory declarations and metadata
        run: python -B -m unittest discover -s scripts/tests -p test_settings_inventory.py -v
      - name: Test artifact ownership, leases and expiry
        run: python -B -m unittest discover -s scripts/tests -p test_validation_artifacts.py -v
      - name: Test scheduled artifact collection and installer contracts
        run: python -B -m unittest discover -s scripts/tests -p test_validation_sweeper.py -v
      - name: Test artifact runner cleanup and budget cancellation
        run: python -B -m unittest discover -s scripts/tests -p test_validation_runner.py -v
      - name: Test bounded validation uploads
        run: python -B -m unittest discover -s scripts/tests -p test_validation_upload.py -v

  validation-upload-smoke:
    name: Validation upload round trip (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Write small owned upload fixture
        shell: python
        run: |
          from pathlib import Path
          Path('upload-smoke').mkdir()
          Path('upload-smoke/result.txt').write_bytes(b'validation\n')
      - uses: ./.github/actions/validation-upload
        with:
          name: validation-upload-smoke-${{ matrix.os }}
          path: upload-smoke/*.txt
          retention-days: 1
          max-bytes: 32
          if-no-files-found: error
      - uses: actions/download-artifact@v8
        with:
          name: validation-upload-smoke-${{ matrix.os }}
          path: download-smoke
      - name: Verify original download layout and bytes
        shell: python
        run: |
          from pathlib import Path
          assert Path('download-smoke/result.txt').read_bytes() == b'validation\n'
          assert len(list(Path('download-smoke').rglob('*'))) == 1
