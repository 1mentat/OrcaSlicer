# NEVER MERGE. One-shot canary for the Flatpak system runtime update failure ("Failed to update
# org.gnome.Sdk: Invalid cross-device link") on ubuntu-24.04 hosted runners. Work item:
# flatpak-system-dir-canary-20261116. It checks nothing out and builds nothing.
# It runs the exact bound operation (flatpak --system update --subpath= -y --noninteractive -v
# org.gnome.Sdk/x86_64/50, see flatpak-builder builder_manifest_update_single_dep) twice from the
# same starting state: once on the original system installation (/var/lib/flatpak, container
# overlay) as the control, and once on a job-private copy placed on the runner's bind-mounted
# ext4 work directory via the documented FLATPAK_SYSTEM_DIR / FLATPAK_SYSTEM_CACHE_DIR
# variables (flatpak 1.18.1: doc/flatpak.xml, common/flatpak-dir.c
# flatpak_get_system_default_base_dir_location). The pristine copy is taken and verified BEFORE the
# control mutates anything. Same pinned image, remotes, signature settings and refs; no cache, image,
# kernel, Docker or permission change; the copy is deleted at the end.
name: Flatpak system dir canary

on:
  push:
    branches:
      - diag/flatpak-system-dir-canary

permissions:
  contents: read

concurrency:
  group: flatpak-system-dir-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Flatpak system installation location canary (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77
      options: --privileged
      volumes:
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
        - /opt/ghc:/opt/ghc1
        - /usr/local/share/boost:/usr/local/share/boost1
        - /opt/hostedtoolcache:/opt/hostedtoolcache1
    env:
      REF: org.gnome.Sdk/x86_64/50
    steps:
      # Same free-space step as the real Flatpak job (build_all.yml): the canary mounts the same volumes.
      - name: Free runner disk space like the real job (best effort, bounded)
        timeout-minutes: 5
        shell: bash
        run: |
          set +e +o pipefail
          timeout --kill-after=15 270 rm -rf /usr/local/lib/android/* /usr/share/dotnet/* /opt/ghc1/* "/usr/local/share/boost1/*" /opt/hostedtoolcache1/*
          echo "free-space rc=$? (124 = stopped at the time bound; the headroom check below decides)"
          df -Pm "$RUNNER_TEMP" | awk 'NR==2{print "free MiB at RUNNER_TEMP: "$4}'

      - name: Identities and filesystem layout (read-only)
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          echo "work item: flatpak-system-dir-canary-20261116"
          echo "workflow ref: ${GITHUB_REF} sha: ${GITHUB_SHA} run: ${GITHUB_RUN_ID} attempt: ${GITHUB_RUN_ATTEMPT}"
          echo "container image digest: sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77"
          uname -r
          flatpak --version
          flatpak-builder --version
          echo "--- installations and system remotes"
          flatpak --installations 2>&1 | head
          flatpak remotes --system -d 2>&1 | cut -c1-200 | head
          echo "--- filesystem per path"
          for path in /var/lib/flatpak /var/tmp "$RUNNER_TEMP" "$GITHUB_WORKSPACE"; do
            if [ -e "$path" ]; then
              stat -f -c '%n fstype=%T' "$path"
              stat -c '%n dev=%d' "$path"
            fi
          done
          df -T /var/lib/flatpak "$RUNNER_TEMP" 2>&1 | head -6
          for p in redirect_dir metacopy index xino_auto; do
            printf 'overlay %s=' "$p"; cat "/sys/module/overlay/parameters/$p" 2>&1 | head -1
          done
          need_mb=$(du -sx --block-size=1M /var/lib/flatpak 2>/dev/null | cut -f1)
          avail_mb=$(df -Pm "$RUNNER_TEMP" | awk 'NR==2{print $4}')
          echo "installation size MiB: ${need_mb:-unknown}; free MiB at RUNNER_TEMP: ${avail_mb:-unknown}"

      - name: Control and candidate updates from one verified pristine starting state (bounded)
        if: ${{ !cancelled() }}
        timeout-minutes: 11
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          deadline=$((SECONDS + 600))
          budget() { local r=$((deadline - SECONDS - 20)); [ "$r" -gt "$1" ] && r=$1; [ "$r" -lt 30 ] && r=0; echo "$r"; }
          control_rc=97; cand_rc=97; verdict="invalid"
          CANARY_ROOT="$RUNNER_TEMP/flatpak-canary"
          case "$RUNNER_TEMP" in /__w/_temp) ;; *) echo "unexpected RUNNER_TEMP: $RUNNER_TEMP"; exit 2 ;; esac
          [ ! -e "$CANARY_ROOT" ] || { echo "canary root already exists; refusing"; exit 2; }
          need_mb=$(du -sx --block-size=1M /var/lib/flatpak | cut -f1)
          avail_mb=$(df -Pm "$RUNNER_TEMP" | awk 'NR==2{print $4}')
          need_total=$(( need_mb * 2 + 8192 ))
          echo "installation ${need_mb} MiB; need at least ${need_total} MiB free, have ${avail_mb} MiB"
          if [ "${avail_mb:-0}" -lt "$need_total" ]; then echo "VERDICT: invalid (insufficient headroom)"; exit 3; fi
          mkdir -m 700 "$CANARY_ROOT" || exit 2
          : > "$CANARY_ROOT/.owner-$GITHUB_RUN_ID"
          mkdir -m 700 "$CANARY_ROOT/cache"
          [ ! -L /var/lib/flatpak ] || { echo "/var/lib/flatpak is a symlink; refusing"; exit 2; }
          list_state() { flatpak --system list --runtime -d --columns=ref,origin,commit 2>&1 | sort; }
          # ---- pristine starting snapshot, taken and verified BEFORE anything mutates the original
          echo "=== SNAPSHOT /var/lib/flatpak -> $CANARY_ROOT/system"
          t=$(budget 200); snap_rc=124
          if [ "$t" -gt 0 ]; then
            timeout --kill-after=15 "$t" cp -a /var/lib/flatpak "$CANARY_ROOT/system" 2>"$CANARY_ROOT/cp.err"
            snap_rc=$?
          fi
          tail -c 65536 "$CANARY_ROOT/cp.err" 2>/dev/null
          echo "snapshot copy rc=$snap_rc"
          ORIG_STATE="$(list_state)"
          ORIG_REMOTES="$(flatpak remotes --system -d 2>&1 | sort)"
          SNAP_STATE="$(FLATPAK_SYSTEM_DIR="$CANARY_ROOT/system" FLATPAK_SYSTEM_CACHE_DIR="$CANARY_ROOT/cache" list_state)"
          SNAP_REMOTES="$(FLATPAK_SYSTEM_DIR="$CANARY_ROOT/system" FLATPAK_SYSTEM_CACHE_DIR="$CANARY_ROOT/cache" flatpak remotes --system -d 2>&1 | sort)"
          snap_ok=1
          [ "$snap_rc" = 0 ] || snap_ok=0
          [ -n "$ORIG_STATE" ] && [ "$ORIG_STATE" = "$SNAP_STATE" ] && echo "SNAPSHOT identity: installed refs and commits identical" || { echo "SNAPSHOT identity: MISMATCH"; snap_ok=0; }
          [ "$ORIG_REMOTES" = "$SNAP_REMOTES" ] && echo "SNAPSHOT identity: remotes identical" || { echo "SNAPSHOT identity: remotes MISMATCH"; snap_ok=0; }
          cmp /var/lib/flatpak/repo/config "$CANARY_ROOT/system/repo/config" && echo "SNAPSHOT identity: repo/config identical (remote trust settings)" || snap_ok=0
          for k in /var/lib/flatpak/repo/*.trustedkeys.gpg; do
            [ -e "$k" ] || continue
            cmp "$k" "$CANARY_ROOT/system/repo/${k##*/}" && echo "SNAPSHOT identity: ${k##*/} identical" || snap_ok=0
          done
          grep -E '^\[remote|gpg-verify|url=|collection-id' /var/lib/flatpak/repo/config | cut -c1-120 | head -20
          # ---- positive location check against the candidate path BEFORE any mutation
          export_dir="$CANARY_ROOT/system"; export_cache="$CANARY_ROOT/cache"
          echo "=== CANDIDATE location checks (before any update)"
          echo "FLATPAK_SYSTEM_DIR=$export_dir"
          FLATPAK_SYSTEM_DIR="$export_dir" FLATPAK_SYSTEM_CACHE_DIR="$export_cache" flatpak --installations 2>&1 | head -3
          loc="$(FLATPAK_SYSTEM_DIR="$export_dir" FLATPAK_SYSTEM_CACHE_DIR="$export_cache" flatpak info --system --show-location "$REF" 2>&1 | head -1)"
          echo "deployment location: $loc"
          case "$loc" in "$export_dir"/*) echo "LOCATION OK: under the job-private copy" ;; *) echo "LOCATION MISMATCH: not under the private copy"; snap_ok=0 ;; esac
          if [ "$(stat -L -c %d "$loc" 2>/dev/null)" = "$(stat -L -c %d /var/lib/flatpak)" ]; then echo "DEVICE CHECK FAILED: candidate is on the same device as /var/lib/flatpak"; snap_ok=0; else echo "DEVICE CHECK OK: candidate deployment is on a different device than /var/lib/flatpak"; fi
          for path in "$export_dir" "$export_cache"; do stat -f -c '%n fstype=%T' "$path"; stat -c '%n dev=%d' "$path"; done
          # ---- control: original path
          echo "=== CONTROL (original path /var/lib/flatpak): flatpak --system update --subpath= -y --noninteractive -v $REF"
          t=$(budget 160)
          if [ "$t" -gt 0 ]; then
            log="$(mktemp)"
            timeout --kill-after=15 "$t" flatpak --system update --subpath= -y --noninteractive -v "$REF" >"$log" 2>&1
            control_rc=$?
            tail -c 786432 "$log"; rm -f "$log"
          else echo "SKIPPED: no time left"; control_rc=96; fi
          echo "=== CONTROL exit status: $control_rc (124 = timeout)"
          echo "--- original installation after control"; list_state | cut -c1-160 | head -12
          # ---- candidate: job-private path, from the untouched snapshot
          echo "=== CANDIDATE (job-private path): flatpak --system update --subpath= -y --noninteractive -v $REF"
          if [ "$snap_ok" = 1 ]; then
            t=$(budget 160)
            if [ "$t" -gt 0 ]; then
              log="$(mktemp)"
              FLATPAK_SYSTEM_DIR="$export_dir" FLATPAK_SYSTEM_CACHE_DIR="$export_cache" timeout --kill-after=15 "$t" flatpak --system update --subpath= -y --noninteractive -v "$REF" >"$log" 2>&1
              cand_rc=$?
              tail -c 786432 "$log"; rm -f "$log"
            else echo "SKIPPED: no time left"; cand_rc=96; fi
            echo "--- private installation after candidate"
            FLATPAK_SYSTEM_DIR="$export_dir" FLATPAK_SYSTEM_CACHE_DIR="$export_cache" list_state | cut -c1-160 | head -12
          else
            echo "CANDIDATE INVALID (snapshot or location check failed); not run"; cand_rc=98
          fi
          echo "=== CANDIDATE exit status: $cand_rc (124 = timeout; 98 = invalid; 96 = no time)"
          if [ "$snap_ok" != 1 ]; then verdict="invalid (snapshot/location gate failed)"
          elif [ "$cand_rc" != 0 ]; then verdict="candidate does not mitigate (or timed out)"
          elif [ "$control_rc" != 0 ]; then verdict="discriminating: control failed, candidate passed"
          else verdict="inconclusive (healthy host: both paths passed)"; fi
          echo "RESULT control_rc=$control_rc candidate_rc=$cand_rc snapshot_ok=$snap_ok"
          echo "VERDICT: $verdict"
          exit "$cand_rc"

      - name: Dispose the job-private copy
        if: ${{ always() }}
        timeout-minutes: 1
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          CANARY_ROOT="$RUNNER_TEMP/flatpak-canary"
          if [ "$RUNNER_TEMP" = "/__w/_temp" ] && [ -d "$CANARY_ROOT" ] && [ ! -L "$CANARY_ROOT" ] && [ -e "$CANARY_ROOT/.owner-$GITHUB_RUN_ID" ]; then
            rm -rf --one-file-system -- "$CANARY_ROOT"
            echo "disposed $CANARY_ROOT (exists afterwards: $([ -e "$CANARY_ROOT" ] && echo yes || echo no))"
          else
            echo "nothing owned by this run to dispose"
          fi
